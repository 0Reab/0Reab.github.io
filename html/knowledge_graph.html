<h1>Knowledge graph</h1>

<div class="kg-stage">

    <span class="kg-zoom-group">
        <button id="kg-zoom-out" class="corner-btn" type="button" aria-label="Zoom out">&minus;</button>

        <button id="kg-fullscreen" class="corner-btn" type="button">fullscreen</button>

</div>

</div>
